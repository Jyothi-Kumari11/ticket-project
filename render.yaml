services:
  - type: web
    name: resolvedesk-system
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run server
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: ticket-management
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
